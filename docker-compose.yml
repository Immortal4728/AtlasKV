services:
  # ── Raft Node 1 (Leader / Initial Bootstrap) ────────────────────────────────
  atlaskv-node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlaskv-node1
    environment:
      - SERVER_PORT=8081
      - GRPC_PORT=50051
      - RAFT_NODE_ID=node1
      - RAFT_DATA_DIR=/app/data
      - CLUSTER_MEMBERS=node1:atlaskv-node1:50051,node2:atlaskv-node2:50052,node3:atlaskv-node3:50053
      - LOG_LEVEL=INFO
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    ports:
      - "${NODE1_REST_PORT:-8081}:8081"
    volumes:
      - node1-data:/app/data
    networks:
      - atlaskv-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Raft Node 2 (Follower) ──────────────────────────────────────────────────
  atlaskv-node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlaskv-node2
    environment:
      - SERVER_PORT=8082
      - GRPC_PORT=50052
      - RAFT_NODE_ID=node2
      - RAFT_DATA_DIR=/app/data
      - CLUSTER_MEMBERS=node1:atlaskv-node1:50051,node2:atlaskv-node2:50052,node3:atlaskv-node3:50053
      - LOG_LEVEL=INFO
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    ports:
      - "${NODE2_REST_PORT:-8082}:8082"
    volumes:
      - node2-data:/app/data
    networks:
      - atlaskv-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Raft Node 3 (Follower) ──────────────────────────────────────────────────
  atlaskv-node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlaskv-node3
    environment:
      - SERVER_PORT=8083
      - GRPC_PORT=50053
      - RAFT_NODE_ID=node3
      - RAFT_DATA_DIR=/app/data
      - CLUSTER_MEMBERS=node1:atlaskv-node1:50051,node2:atlaskv-node2:50052,node3:atlaskv-node3:50053
      - LOG_LEVEL=INFO
      - AUTH_ENABLED=${AUTH_ENABLED:-false}
      - AUTH_TOKEN=${AUTH_TOKEN:-}
    ports:
      - "${NODE3_REST_PORT:-8083}:8083"
    volumes:
      - node3-data:/app/data
    networks:
      - atlaskv-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── AtlasKV Studio (Web Management Console) ──────────────────────────────────
  atlaskv-studio:
    build:
      context: ./atlaskv-studio
      dockerfile: Dockerfile
    container_name: atlaskv-studio
    environment:
      - PORT=3000
      - BACKEND_URL=http://atlaskv-node1:8081
      - BACKEND_AUTH_TOKEN=${AUTH_TOKEN:-}
    ports:
      - "${STUDIO_PORT:-3000}:3000"
    networks:
      - atlaskv-net
    depends_on:
      atlaskv-node1:
        condition: service_healthy

networks:
  atlaskv-net:
    driver: bridge

volumes:
  node1-data:
  node2-data:
  node3-data:
