# ====================================================
# AtlasKV 3-Node Cluster — Docker Compose
# ====================================================

version: '3.8'

services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlaskv-node1
    ports:
      - "8081:8080"
      - "50051:50051"
    environment:
      - NODE_ID=node1
      - REST_PORT=8080
      - GRPC_PORT=50051
      - DATA_DIRECTORY=/app/data
      - PEER_NODES=node1:node1:50051,node2:node2:50052,node3:node3:50053
      - LOG_LEVEL=INFO
    volumes:
      - node1-data:/app/data
    networks:
      - atlaskv-net
    restart: unless-stopped

  node2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlaskv-node2
    ports:
      - "8082:8080"
      - "50052:50052"
    environment:
      - NODE_ID=node2
      - REST_PORT=8080
      - GRPC_PORT=50052
      - DATA_DIRECTORY=/app/data
      - PEER_NODES=node1:node1:50051,node2:node2:50052,node3:node3:50053
      - LOG_LEVEL=INFO
    volumes:
      - node2-data:/app/data
    networks:
      - atlaskv-net
    depends_on:
      - node1
    restart: unless-stopped

  node3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlaskv-node3
    ports:
      - "8083:8080"
      - "50053:50053"
    environment:
      - NODE_ID=node3
      - REST_PORT=8080
      - GRPC_PORT=50053
      - DATA_DIRECTORY=/app/data
      - PEER_NODES=node1:node1:50051,node2:node2:50052,node3:node3:50053
      - LOG_LEVEL=INFO
    volumes:
      - node3-data:/app/data
    networks:
      - atlaskv-net
    depends_on:
      - node1
      - node2
    restart: unless-stopped

volumes:
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local

networks:
  atlaskv-net:
    name: atlaskv-net
    driver: bridge
