# ====================================================
# AtlasKV 3-Node Cluster — Docker Compose
# ====================================================
#
# Usage:
#   docker-compose up -d
#   docker-compose logs -f
#   docker-compose down -v
#
# Access:
#   Node 1 REST: http://localhost:8081
#   Node 2 REST: http://localhost:8082
#   Node 3 REST: http://localhost:8083
#   Swagger UI:  http://localhost:8081/swagger-ui.html
#

services:
  node1:
    build: .
    container_name: atlaskv-node1
    ports:
      - "8081:8080"
      - "50051:50051"
    environment:
      - ATLASKV_NODE_ID=node1
      - ATLASKV_RAFT_DATA_DIR=/app/data
      - ATLASKV_RAFT_PEER_ADDRESSES_NODE2=node2:50052
      - ATLASKV_RAFT_PEER_ADDRESSES_NODE3=node3:50053
      - ATLASKV_SERVER_GRPC_PORT=50051
    volumes:
      - node1-data:/app/data
    networks:
      - atlaskv-net
    restart: unless-stopped

  node2:
    build: .
    container_name: atlaskv-node2
    ports:
      - "8082:8080"
      - "50052:50052"
    environment:
      - ATLASKV_NODE_ID=node2
      - ATLASKV_RAFT_DATA_DIR=/app/data
      - ATLASKV_RAFT_PEER_ADDRESSES_NODE1=node1:50051
      - ATLASKV_RAFT_PEER_ADDRESSES_NODE3=node3:50053
      - ATLASKV_SERVER_GRPC_PORT=50052
    volumes:
      - node2-data:/app/data
    networks:
      - atlaskv-net
    restart: unless-stopped

  node3:
    build: .
    container_name: atlaskv-node3
    ports:
      - "8083:8080"
      - "50053:50053"
    environment:
      - ATLASKV_NODE_ID=node3
      - ATLASKV_RAFT_DATA_DIR=/app/data
      - ATLASKV_RAFT_PEER_ADDRESSES_NODE1=node1:50051
      - ATLASKV_RAFT_PEER_ADDRESSES_NODE2=node2:50052
      - ATLASKV_SERVER_GRPC_PORT=50053
    volumes:
      - node3-data:/app/data
    networks:
      - atlaskv-net
    restart: unless-stopped

volumes:
  node1-data:
    driver: local
  node2-data:
    driver: local
  node3-data:
    driver: local

networks:
  atlaskv-net:
    driver: bridge
